[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soda-benchmarks"
version = "0.1.0"
requires-python = ">=3.11"
# No dependencies on purpose: torch and the MLIR/SODA bindings are installed in
# the container and reach Python through pixi.toml's PYTHONPATH, not from PyPI.

[project.scripts]
sb-cli = "sb_cli.__main__:main"

# Flat layout: sb_cli/ and benches/ sit at the repo root and ship as one
# distribution. namespaces = false collects only directories with an
# __init__.py, which already skips benches/experiments/, benches/tests/, and
# benches/PolyBenchC-4.2.1/.
[tool.setuptools.packages.find]
include = ["sb_cli*", "benches*"]
namespaces = false

[tool.setuptools.package-data]
"sb_cli.templates" = ["*.tmpl"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["benches/tests"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (MLIR generation via torch-mlir)",
    "sc: needs the siliconcompiler package (pixi environment `sc`)",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[tool.coverage.run]
source = ["benches/PolyBenchPyTorch", "sb_cli"]
omit = ["benches/tests/*", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
